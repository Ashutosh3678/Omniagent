# Render Blueprint: the OmniAgent backend and its PostgreSQL database.
# Deploy: Render dashboard > New > Blueprint > pick this repository.
services:
  - type: web
    name: omniagent-backend
    runtime: python
    plan: free              # free services sleep after 15 minutes idle; use "starter" for always-on
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations run first, then the server. --proxy-headers makes rate limits see real client IPs.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OMNIAGENT_ENV
        value: production
      - key: OMNIAGENT_JWT_SECRET
        generateValue: true   # a random secret, created once and kept
      - key: OMNIAGENT_DATABASE_URL
        fromDatabase:
          name: omniagent-db
          property: connectionString
      - key: OMNIAGENT_GROQ_API_KEY
        sync: false           # you paste this in the dashboard; it is never stored in git

databases:
  - name: omniagent-db
    plan: free              # free Postgres is deleted after 30 days; use "basic-256mb" to keep your data
    databaseName: omniagent
    user: omniagent
