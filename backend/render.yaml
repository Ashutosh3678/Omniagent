# Render Blueprint for the OmniAgent backend (database: Neon, set below).
# Render dashboard > New > Blueprint > pick this repository > set "Blueprint file path" to backend/render.yaml.
services:
  - type: web
    name: omniagent-backend
    runtime: python
    plan: free                # free services sleep after 15 minutes idle; use "starter" to stay awake
    rootDir: backend          # the code lives in backend/ of the repository
    buildCommand: pip install -r requirements.txt
    # Migrations run first, then the server. --proxy-headers makes rate limits see real client IPs.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OMNIAGENT_ENV
        value: production
      - key: OMNIAGENT_JWT_SECRET
        generateValue: true   # a random secret, created once and kept
      - key: OMNIAGENT_DATABASE_URL
        sync: false           # Neon pooled connection string (DATABASE_URL); paste it in the dashboard
      - key: OMNIAGENT_MIGRATION_DATABASE_URL
        sync: false           # Neon direct connection string (DATABASE_URL_UNPOOLED), used for migrations
      - key: CLOUDINARY_URL
        sync: false           # cloudinary://<api_key>:<api_secret>@<cloud_name>; screenshots go to the CDN, without it they stay in the database
      - key: OMNIAGENT_GROQ_API_KEY
        sync: false           # paste in the dashboard; never stored in git
